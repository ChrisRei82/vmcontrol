<!DOCTYPE html>
<html>
<head>
    <title>VM Control</title>
</head>
<body>
    <h1>VM Control</h1>

    <button onclick="startVm()">
        VM starten
    </button>

    <h3 id="status"></h3>

    <script>
        async function startVm() {
            const statusEl = document.getElementById("status");
            statusEl.innerText = "Starte VM...";

            try {
                // Aufruf über die eigene Azure Function als Proxy, um CORS-Fehler zu umgehen
                const response = await fetch(
                    "/api/start-vm",
                    {
                        method: "POST"
                    }
                );

                if (response.ok) {
                    statusEl.innerText = "Start erfolgreich ausgelöst!";
                } else {
                    statusEl.innerText = "Fehler beim Auslösen.";
                }
            } catch (error) {
                statusEl.innerText = "Netzwerkfehler: " + error;
            }
        }
    </script>
</body>
</html>
